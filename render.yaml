# Render Blueprint — provisions the backend web service and its Postgres
# database together. In the Render dashboard: New > Blueprint > select this repo.
# GEMINI_API_KEY and CORS_ORIGINS are marked sync: false — Render will prompt
# for them in the dashboard rather than storing a value here.
databases:
  - name: aurora-db
    plan: free
    databaseName: aurora
    user: aurora

services:
  - type: web
    name: aurora-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aurora-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
